name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    # SpectacleCore, the platform-independent Swift window layout package. Built and tested on Linux
    # to keep it free of macOS-only dependencies.
    name: SpectacleCore (Swift, Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build and test
        run: swift test --package-path SpectacleCore

  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the "Update CFBundleVersion" build phase can count commits.
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Spectacle.xcodeproj \
            -scheme Spectacle \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project Spectacle.xcodeproj \
            -scheme Spectacle \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package Release build
        run: |
          app="build/Build/Products/Release/Lens.app"
          test -d "$app"
          ditto -c -k --keepParent "$app" Lens.zip

      # An unsigned, un-notarized test build for trying changes on a real Mac. Not a release: macOS
      # will refuse to open it until you right-click it and choose Open (or clear the quarantine flag).
      - name: Upload Release build
        uses: actions/upload-artifact@v4
        with:
          name: Spectacle-unsigned-${{ github.sha }}
          path: Lens.zip
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
